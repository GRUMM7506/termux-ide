name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Termux server
        run: |
          python3 -m py_compile assets/termux/server.py
          bash -n assets/termux/start.sh termux/install.sh
          cmp termux/install.sh assets/termux/install.sh

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.TIDE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "TIDE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with release key"
          else
            echo "::warning::No TIDE_KEYSTORE_BASE64 secret — APK is signed with a debug key"
          fi

      - name: Build APK
        env:
          TIDE_KEYSTORE_PASSWORD: ${{ secrets.TIDE_KEYSTORE_PASSWORD }}
        run: |
          ARGS=(--release --build-number="$GITHUB_RUN_NUMBER")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then ARGS+=(--build-name="${GITHUB_REF_NAME#v}"); fi
          NAME="TermuxIDE-${GITHUB_REF_NAME//\//-}"
          OUT=build/app/outputs/flutter-apk
          mkdir -p dist
          flutter build apk "${ARGS[@]}"
          cp "$OUT/app-release.apk" "dist/$NAME-universal.apk"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            flutter build apk "${ARGS[@]}" --split-per-abi
            cp "$OUT/app-arm64-v8a-release.apk" "dist/$NAME-arm64-v8a.apk"
            cp "$OUT/app-armeabi-v7a-release.apk" "dist/$NAME-armeabi-v7a.apk"
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: TermuxIDE-apk
          path: dist/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body_path: .github/release-notes.md
          make_latest: true
